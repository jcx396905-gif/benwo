name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      
      - run: flutter pub get
      
      - run: flutter build windows --release
      
      - name: Package
        run: |
          7z a BenWo-Windows-x64.zip build/windows/x64/runner/Release/*
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BenWo-Windows-x64.zip
