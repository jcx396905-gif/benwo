name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload to (e.g. v1.0.9)'
        required: true
        default: 'v1.0.9'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      
      - name: Setup API constants
        run: copy lib\core\constants\api_constants.example.dart lib\core\constants\api_constants.dart
        shell: cmd
      
      - run: flutter pub get
      
      - run: flutter build windows --release
      
      - name: Package
        run: |
          7z a BenWo-Windows-x64.zip build/windows/x64/runner/Release/*
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: BenWo-Windows-x64.zip
