name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [pr-2-focus]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore gitignored API constants from example
        run: |
          cp lib/core/constants/api_constants.example.dart lib/core/constants/api_constants.dart

      - name: Create keystore from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks || echo "no keystore secret, using debug signing"

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: benwo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
